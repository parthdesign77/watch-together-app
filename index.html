<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary SEO Metadata -->
    <title>Watch Together - Watch Videos Together Online | Synchronized Watch Party</title>
    <meta
      name="description"
      content="Host virtual watch parties and watch videos together online in perfect sync. Share rooms with friends to stream YouTube, movies, and anime with live voice and chat."

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://watch-together7.vercel.app/" />
    <meta name="theme-color" content="#030303" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://watch-together7.vercel.app/" />
    <meta property="og:title" content="Watch Together - Synchronized Online Watch Party Platform" />
    <meta property="og:description" content="Watch movies, anime, and YouTube together in real-time sync with voice and chat. Join instant virtual watch rooms." />
    <meta property="og:image" content="https://watch-together7.vercel.app/logo.png" />
    <meta property="og:site_name" content="Watch Together" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="Watch Together - Watch Videos in Sync with Friends" />
    <meta name="twitter:description" content="Host real-time watch parties for YouTube, movies, and anime. Complete with voice rooms, low-latency sync, and zero signups required." />

    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- DNS prefetch and preconnect to reduce latency on third-party domains -->
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://cdn.myanimelist.net" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://cdn.myanimelist.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- High-Performance Asynchronous Google Fonts Loading (non-blocking) -->
    <link
      rel="preload"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Critical local asset preloads -->
    <link rel="preload" as="image" href="/logo.png" />

    <!-- Structured Schema Markup (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Watch Together",
      "url": "https://watch-together7.vercel.app/",
      "description": "Host synchronized watch parties and watch videos together online with voice, chat, and screen sharing.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://watch-together7.vercel.app/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Watch Together",
      "operatingSystem": "All",
      "applicationCategory": "MultimediaApplication",
      "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "USD"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "845"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <style>
        body {
          margin: 0;
          background: #030303;
          background-image: radial-gradient(circle at 50% 50%, #0d0404 0%, #030303 100%);
          display: grid;
          min-height: 100vh;
          place-items: center;
          overflow: hidden;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .initial-loader {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .initial-logo {
          height: 64px;
          width: auto;
          object-fit: contain;
          animation: initial-rotate 3.5s linear infinite;
          filter: drop-shadow(0 0 25px rgba(255, 61, 71, 0.65));
        }
        @keyframes initial-rotate {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader">
        <img src="/logo.png" alt="Watch Together" class="initial-logo" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
